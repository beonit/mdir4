[package]
name = "mdir4"
version = "0.1.0"
edition = "2024"
description = "A modern terminal file manager inspired by Mdir III"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossterm = "0.29.0"
fs2 = "0.4.3"
ratatui = "0.30.2"
serde = { version = "1.0.228", features = ["derive"] }
shell-words = "1.1.0"
thiserror = "2.0.19"
toml = "0.9.8"
trash = "5.2.3"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[dev-dependencies]
insta = "1.48.0"
serde_yaml = "0.9.34"
tempfile = "3.27.0"
