name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features --locked

      - name: Reject unreviewed snapshots
        shell: bash
        run: |
          snapshots="$(find . -path ./target -prune -o -name '*.snap.new' -print)"
          if [[ -n "$snapshots" ]]; then
            echo "Unreviewed Insta snapshots found:"
            echo "$snapshots"
            exit 1
          fi

  release-candidate:
    name: Release candidate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Set native package target
        shell: bash
        run: echo "PACKAGE_TARGET=$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m)" >> "$GITHUB_ENV"

      - name: Build locked release binary
        run: cargo build --release --locked

      - name: Package release candidate
        run: >-
          python3 scripts/package_release.py
          --binary target/release/mdir4
          --target ${{ env.PACKAGE_TARGET }}

      - name: Verify package contains no workspace path
        shell: bash
        run: >-
          if unzip -p dist/mdir4-v0.1.0-${{ env.PACKAGE_TARGET }}.zip
          | grep -F "$GITHUB_WORKSPACE"; then
            echo "Workspace path leaked into package";
            exit 1;
          fi

      - name: Upload immutable candidate
        uses: actions/upload-artifact@v7
        with:
          name: mdir4-v0.1.0-${{ env.PACKAGE_TARGET }}
          path: |
            dist/mdir4-v0.1.0-${{ env.PACKAGE_TARGET }}.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
